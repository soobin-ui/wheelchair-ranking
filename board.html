<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>휠체어 레이싱 랭킹보드</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* 세로 55인치 화면 기준 1080×1920 무대를 창 크기에 맞춰 통째로 확대·축소 */
:root{--ink:#eef3fb;--dim:#8ea3c2;--line:rgba(140,180,255,.16);--blue:#3d8bff;--sky:#9cc8ff;--gold:#f6c64f;--goldt:#ffe3a0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body.idle{cursor:none}
.num{font-family:'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.chk{background:conic-gradient(#fff 25%,#000 0 50%,#fff 0 75%,#000 0) 0 0/26px 26px}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;
  font-family:Pretendard,'Malgun Gothic',sans-serif;color:var(--ink);
  background:
    repeating-linear-gradient(115deg,transparent 0 160px,rgba(140,190,255,.03) 160px 167px,transparent 167px 320px),
    radial-gradient(900px 600px at 90% -5%,rgba(110,170,255,.30),transparent 70%),
    radial-gradient(800px 600px at 0% 105%,rgba(50,110,255,.25),transparent 70%),
    linear-gradient(180deg,#0c1a33,#070f20 60%,#050b18)}

/* 머리 */
.top{position:absolute;left:48px;right:48px;top:40px;display:flex;justify-content:space-between;align-items:baseline}
.t1{font-family:Montserrat,sans-serif;font-style:italic;font-weight:800;font-size:30px;letter-spacing:.08em;color:var(--sky)}
.when{font-size:28px;color:var(--dim);font-weight:500}
.when b{font-family:'Barlow Condensed';font-size:46px;color:var(--ink);font-weight:700;margin-left:14px}
.t2{position:absolute;left:44px;top:88px;font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;font-size:92px;line-height:1.05;padding-right:.15em;white-space:nowrap;
  background:linear-gradient(180deg,#fff 0%,#dce9ff 45%,#8fb6ee 55%,#d3e4ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{position:absolute;left:48px;right:48px;top:224px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tab{transform:skewX(-14deg);height:78px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);background:rgba(20,40,80,.5)}
.tab span{transform:skewX(14deg);font-size:38px;font-weight:800;color:var(--dim);white-space:nowrap}
.tab small{font-size:24px;font-weight:600;margin-left:8px}
.tab.on{background:linear-gradient(180deg,#3d8bff,#2059d6);border-color:#7fb4ff;box-shadow:0 0 28px rgba(61,139,255,.45)}
.tab.on span{color:#fff}
.prog{position:absolute;left:48px;top:314px;height:5px;width:0;background:var(--sky);box-shadow:0 0 12px var(--sky)}

/* 1위 */
.hero{position:absolute;left:48px;right:48px;top:344px;height:350px;overflow:hidden;
  clip-path:polygon(0 0,100% 0,calc(100% - 34px) 100%,0 100%);
  background:linear-gradient(160deg,rgba(246,198,79,.40) 0%,rgba(246,198,79,.14) 55%,rgba(20,36,70,.6) 100%);
  border-left:14px solid var(--gold)}
.hero::before{content:"";position:absolute;inset:0;border-top:3px solid var(--gold);border-bottom:3px solid var(--gold);pointer-events:none}
.hero .flag{position:absolute;right:0;top:0;width:150px;height:110px;opacity:.28;-webkit-mask:linear-gradient(90deg,transparent,#000);mask:linear-gradient(90deg,transparent,#000)}
.hero .p{position:absolute;left:18px;top:34px;display:flex;align-items:flex-start;font-family:'Barlow Condensed';font-style:italic;font-weight:900;font-size:200px;line-height:.8;color:var(--gold);text-shadow:0 0 40px rgba(246,198,79,.5);padding-right:10px}
.hero .p sup{font-size:52px;line-height:1;margin:8px 0 0 12px}
.hero .lead{position:absolute;left:230px;top:30px;font-size:28px;font-weight:800;letter-spacing:.06em;background:var(--gold);color:#3a2800;padding:5px 16px;transform:skewX(-12deg)}
.hero .meta{position:absolute;right:70px;top:30px;font-size:26px;color:var(--goldt);font-weight:600}
.hero .meta b{font-family:'Barlow Condensed';font-size:40px;color:#fff;margin-left:10px}
.hero .rec{position:absolute;left:222px;top:62px;font-family:'Barlow Condensed';font-style:italic;font-weight:800;font-size:210px;line-height:.86;padding:6px .1em 4px .04em;
  background:linear-gradient(180deg,#fff7dc 0%,#ffe08a 45%,#c9952a 55%,#ffe7a8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(0,0,0,.35))}
.hero .who{position:absolute;left:30px;right:80px;bottom:26px;display:flex;align-items:baseline;gap:22px;white-space:nowrap;overflow:hidden}
.hero .nm{font-size:60px;font-weight:800;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hero .sc{font-size:36px;font-weight:600;color:var(--goldt);flex:none}
.hero.empty .rec{font-size:150px;top:110px;opacity:.5}
.hero.empty .who .nm{font-size:44px;color:var(--goldt)}

/* 2~10위 */
.list{position:absolute;left:48px;right:48px;top:712px}
.th{display:grid;grid-template-columns:120px 1fr 300px;height:36px;font-size:24px;color:var(--dim);font-weight:600}
.th div:last-child{text-align:right;padding-right:34px}
.row{display:grid;grid-template-columns:120px 1fr 300px;align-items:center;height:90px;margin-bottom:8px;
  clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,0 100%);background:linear-gradient(90deg,rgba(40,70,130,.55),rgba(20,40,80,.32))}
.row:nth-child(odd){background:linear-gradient(90deg,rgba(40,70,130,.40),rgba(20,40,80,.22))}
.row .p{height:100%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-style:italic;font-weight:800;font-size:56px;padding-right:8px;
  background:rgba(255,255,255,.08);clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,0 100%)}
.row.r2 .p{background:linear-gradient(160deg,#fff,#9fb0c4);color:#1d2836}
.row.r3 .p{background:linear-gradient(160deg,#f5c39a,#b9662e);color:#2e1404}
.row .who{padding-left:24px;min-width:0}
.row .nm{font-size:40px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sc{font-size:26px;font-weight:500;color:var(--sky);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rc{text-align:right;padding-right:40px;line-height:1}
.row .rc b{display:block;font-family:'Barlow Condensed';font-style:italic;font-weight:800;font-size:74px;line-height:1;padding:4px .08em 4px 0}
.row .rc i{font-style:normal;font-family:'Barlow Condensed';font-weight:600;font-size:26px;color:var(--dim)}
.row.blank{opacity:.35}.row.blank .nm{color:var(--dim)}
.row.hit{box-shadow:inset 0 0 0 3px var(--blue);background:linear-gradient(90deg,rgba(61,139,255,.5),rgba(61,139,255,.15))}

/* 레인(휠체어) 실시간 */
.lanes{position:absolute;left:48px;right:48px;top:1642px;height:184px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lane{position:relative;border:2px solid var(--line);background:rgba(10,24,52,.75);padding:14px 24px;overflow:hidden}
.lane .lb{font-size:26px;font-weight:800;color:var(--sky);display:flex;align-items:center;gap:10px}
.lane.r .lb{justify-content:flex-end}
.lane .lt{font-family:'Barlow Condensed';font-style:italic;font-weight:800;font-size:84px;line-height:1;margin-top:6px;padding-right:.08em}
.lane .ln{font-size:28px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane .ln small{font-size:24px;color:var(--sky);font-weight:600;margin-left:10px}
.lane.r{text-align:right}
.lane{border-left:8px solid #3d8bff}.lane .lb{color:#7fb4ff}
.lane.r{border-left-width:2px;border-right:8px solid #ff7a3d}.lane.r .lb{color:#ffa06e}
.lane .wait{font-size:34px;color:var(--dim);margin-top:26px;font-weight:600}
.lane.flash{animation:laneFlash 1.2s ease 3}
@keyframes laneFlash{0%,100%{border-color:var(--line)}50%{border-color:var(--sky);box-shadow:0 0 30px rgba(156,200,255,.5)}}

/* 아래 띠 */
footer{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;align-items:center;gap:22px;padding:0 48px 0 0;background:linear-gradient(90deg,#1745b0,#2c6ae0 50%,#1745b0);font-size:30px;font-weight:700}
footer .f{width:110px;height:100%;flex:none}
footer b{font-family:'Barlow Condensed';font-size:46px}
footer .r{margin-left:auto;font-weight:600;font-size:28px}

/* 새 기록 팝업 */
.pop{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:10;
  background:radial-gradient(900px 900px at 50% 50%,#173468,#060d1c 75%)}
.pop.show{display:flex;animation:popIn .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes popIn{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:none}}
.pop .ln{font-size:44px;font-weight:800;color:var(--sky);letter-spacing:.04em}
.pop .k1{font-family:'Barlow Condensed';font-style:italic;font-weight:900;font-size:110px;letter-spacing:.12em;color:var(--sky);margin-top:30px;padding-right:.15em}
.pop .rec{font-family:'Barlow Condensed';font-style:italic;font-weight:800;font-size:330px;line-height:.9;margin-top:30px;padding:0 .1em;
  background:linear-gradient(180deg,#fff 0%,#e4ecf7 45%,#8fa6c4 55%,#eef4fb 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.pop .nm{font-size:84px;font-weight:800;margin-top:30px;max-width:960px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop .sc{font-size:46px;color:var(--sky);font-weight:600;margin-top:6px}
.pop .pl{margin-top:70px;font-size:64px;font-weight:800;padding:18px 54px;border:3px solid var(--sky);transform:skewX(-10deg)}
.pop .pl2{margin-top:24px;font-size:40px;font-weight:700;color:var(--goldt)}
.pop.gold{background:radial-gradient(900px 900px at 50% 50%,#5a4312,#140d02 78%)}
.pop.gold .k1{color:var(--gold)}
.pop.gold .rec{background:linear-gradient(180deg,#fff7dc 0%,#ffe08a 45%,#c9952a 55%,#ffe7a8 100%);-webkit-background-clip:text;background-clip:text}
.pop.gold .pl{border-color:var(--gold);color:var(--gold)}
.pop::before,.pop::after{content:"";position:absolute;left:0;right:0;height:60px;opacity:.5}
.pop::before{top:0;background:conic-gradient(#fff 25%,#000 0 50%,#fff 0 75%,#000 0) 0 0/30px 30px}
.pop::after{bottom:0;background:conic-gradient(#fff 25%,#000 0 50%,#fff 0 75%,#000 0) 0 0/30px 30px}

/* 등장 모션 */
.hero.go{animation:heroIn .7s cubic-bezier(.18,.9,.32,1.25) both}
@keyframes heroIn{0%{opacity:0;transform:translateY(-60px) scale(.92)}60%{opacity:1}100%{opacity:1;transform:none}}
.hero.go .rec{animation:recIn .55s .25s cubic-bezier(.2,.9,.3,1.35) both}
@keyframes recIn{0%{opacity:0;transform:scale(1.3)}100%{opacity:1;transform:none}}
.hero .shine{position:absolute;top:0;bottom:0;left:-300px;width:260px;pointer-events:none;opacity:0;background:linear-gradient(100deg,transparent,rgba(255,240,190,.55),transparent);transform:skewX(-18deg)}
.hero.go .shine{animation:shine .9s .75s ease-out both}
@keyframes shine{0%{opacity:1;left:-300px}100%{opacity:1;left:110%}}
.row{animation:rowIn .5s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(.75s + var(--i) * .11s)}
@keyframes rowIn{0%{opacity:0;transform:translateY(-46px) scaleY(.6)}70%{opacity:1}100%{opacity:1;transform:none}}
/* 1위 갱신: 새 1위가 위에서 망치처럼 내리꽂힘 */
#world{position:absolute;inset:0}
#world.shake{animation:shake .5s linear}
@keyframes shake{0%{transform:translate(0,0)}10%{transform:translate(-14px,18px)}20%{transform:translate(12px,-10px)}30%{transform:translate(-10px,8px)}45%{transform:translate(8px,-6px)}60%{transform:translate(-5px,4px)}80%{transform:translate(3px,-2px)}100%{transform:none}}
.hero.slamcard{z-index:6;animation:slamDown .42s cubic-bezier(.55,0,1,.45) both}
@keyframes slamDown{0%{transform:translateY(-760px) scaleY(1.18)}100%{transform:none}}
.hero.slamcard.hit{animation:slamHit .35s ease-out both}
@keyframes slamHit{0%{transform:scaleY(.86) scaleX(1.03)}55%{transform:scaleY(1.04)}100%{transform:none}}
.speed{position:absolute;left:48px;right:48px;top:0;height:700px;z-index:5;pointer-events:none;opacity:0;
  background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,230,160,.35) 46px 50px,transparent 50px 120px);
  -webkit-mask:linear-gradient(180deg,transparent,#000 70%,transparent);mask:linear-gradient(180deg,transparent,#000 70%,transparent)}
.speed.on{animation:speed .45s ease-in both}
@keyframes speed{0%{opacity:0;transform:translateY(-200px)}60%{opacity:1}100%{opacity:0;transform:translateY(120px)}}
.hero.knock{animation:knock .45s cubic-bezier(.3,0,.8,.6) both}
@keyframes knock{0%{transform:none;opacity:1}100%{transform:translateY(300px) scale(.82,.5);opacity:0}}
#list{transition:transform .35s cubic-bezier(.2,.9,.3,1.3)}
#list.push{transform:translateY(98px)}
.dust{position:absolute;left:48px;right:48px;top:680px;height:40px;z-index:7;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,transparent,rgba(255,230,170,.9) 20%,#fff 50%,rgba(255,230,170,.9) 80%,transparent);filter:blur(6px)}
.dust.on{animation:dust .6s ease-out both}
@keyframes dust{0%{opacity:1;transform:scaleX(.4) scaleY(.3)}100%{opacity:0;transform:scaleX(1.1) scaleY(2.2)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
#flash.on{animation:flash .35s ease-out both}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}
#stamp{position:absolute;left:0;right:0;top:760px;z-index:9;display:none;flex-direction:column;align-items:center;text-align:center;pointer-events:none}
#stamp.on{display:flex}
#stamp .s1{font-size:110px;font-weight:900;color:#2a1a00;line-height:1;padding:26px 56px 30px;transform:rotate(-6deg) skewX(-10deg);
  background:linear-gradient(180deg,#fff2c4,#f6c64f 45%,#d39a22 100%);box-shadow:0 0 0 8px #2a1a00,0 0 0 14px var(--gold),0 20px 60px rgba(0,0,0,.6);white-space:nowrap;
  animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampIn{0%{transform:rotate(-6deg) skewX(-10deg) scale(2.6);opacity:0}100%{transform:rotate(-6deg) skewX(-10deg) scale(1);opacity:1}}
#stamp .s2{margin-top:48px;font-size:40px;font-weight:800;color:#fff;background:rgba(5,11,24,.9);padding:14px 30px;border:2px solid var(--gold);white-space:nowrap;max-width:1000px;overflow:hidden;text-overflow:ellipsis;
  animation:fadeUp .4s .35s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
#stamp.out{animation:stampOut .4s ease-in both}
@keyframes stampOut{to{opacity:0;transform:scale(.9)}}
@media (prefers-reduced-motion:reduce){#world.shake,.hero.slamcard,.hero.knock,.speed.on,.dust.on,#flash.on,#stamp .s1,#stamp .s2{animation:none}}

@media (prefers-reduced-motion:reduce){.hero.go,.hero.go .rec,.hero.go .shine,.row,.pop.show,.lane.flash{animation:none}}
</style></head>
<body>
<div id="stage"><div id="world">
  <div class="top"><span class="t1">WHEELCHAIR RACING</span><span class="when"><span id="date"></span><b id="clock" class="num"></b></span></div>
  <div class="t2">RANKING BOARD</div>
  <div class="tabs"><div class="tab" data-p="today"><span>오늘의 순위</span></div><div class="tab" data-p="total"><span>누적 순위<small>전체 기간</small></span></div></div>
  <div class="prog" id="prog"></div>
  <section class="hero" id="hero"></section>
  <section class="list" id="list"></section>
  <section class="lanes" id="lanes"></section>
  <footer id="foot"></footer>
  <div class="pop" id="pop"></div>
  <div id="flash"></div><div id="stamp"></div>
</div></div>
<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
const stage = $('stage');
let page = 'today', t0 = performance.now(), hitKey = null, popUntil = 0;
const popQ = [], seen = new Set(WR.load().map(r => r.id));

function fit() {
  const k = Math.min(innerWidth / 1080, innerHeight / 1920);
  stage.style.transform = `translate(${(innerWidth - 1080 * k) / 2}px,${(innerHeight - 1920 * k) / 2}px) scale(${k})`;
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function heroHTML(f) {
  return `<i class="shine"></i><div class="p">1<sup>st</sup></div>
    <span class="lead">${page === 'today' ? '오늘의 1위' : '누적 1위'}</span>
    ${f ? `<span class="meta">${page === 'today' ? `도전<b>${f.tries}회</b>` : `기록한 날<b>${WR.dayLabel(f.ts)}</b>`}</span>` : ''}
    <div class="rec">${f ? WR.fmt(f.sec) : '--:--'}</div>
    <div class="who">${f ? `<span class="nm">${esc(f.nick)}</span><span class="sc">${esc(f.org)}</span>` : `<span class="nm">첫 번째 1위에 도전하세요</span>`}</div>`;
}
function render(animate, override) {
  const rs = WR.load(), list = override || (page === 'today' ? WR.rank(WR.todayRecs(rs)) : WR.rank(rs));
  $('list').classList.remove('push');
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.p === page));
  const h = $('hero'), f = list[0];
  h.className = 'hero' + (f ? '' : ' empty');
  h.innerHTML = heroHTML(f);
  if (animate) { h.classList.remove('go'); void h.offsetWidth; h.classList.add('go'); }
  let rows = '';
  for (let i = 1; i < 10; i++) {
    const r = list[i], cls = 'row r' + (i + 1) + (r ? '' : ' blank') + (r && hitKey && WR.personKey(r) === hitKey ? ' hit' : '');
    rows += r ? `<div class="${cls}" style="--i:${i - 1}"><div class="p">${i + 1}</div><div class="who"><div class="nm">${esc(r.nick)}</div><div class="sc">${esc(r.org)}${page === 'total' ? ' · ' + WR.dayLabel(r.ts) : ''}</div></div>
      <div class="rc"><b>${WR.fmt(r.sec)}</b></div></div>`
      : `<div class="${cls}" style="--i:${i - 1}"><div class="p">${i + 1}</div><div class="who"><div class="nm">도전자를 기다리는 중</div></div><div class="rc"><b>--:--</b></div></div>`;
  }
  $('list').innerHTML = `<div class="th"><div style="text-align:center">순위</div><div style="padding-left:24px">닉네임 · 소속</div><div>기록</div></div>` + rows;
  if (!animate) $('list').querySelectorAll('.row').forEach(r => r.style.animation = 'none');
  renderLanes(rs); renderFoot(rs);
}
function renderLanes(rs, flashLane) {
  const tl = WR.rank(WR.todayRecs(rs));
  $('lanes').innerHTML = [1, 2].map(n => {
    const last = rs.filter(r => r.lane === n && WR.dayKey(r.ts) === WR.today()).sort((a, b) => b.ts - a.ts)[0];
    const lb = n === 1 ? `◀ 1번 휠체어 방금 기록` : `2번 휠체어 방금 기록 ▶`;
    if (!last) return `<div class="lane ${n === 2 ? 'r' : ''}"><div class="lb">${lb}</div><div class="wait">출발 준비 중</div></div>`;
    const pl = WR.placeOf(tl, last);
    return `<div class="lane ${n === 2 ? 'r' : ''} ${flashLane === n ? 'flash' : ''}"><div class="lb">${lb}</div><div class="lt">${WR.fmt(last.sec)}</div>
      <div class="ln">${esc(last.nick)}<small>오늘 최고 ${pl}위</small></div></div>`;
  }).join('');
}
function renderFoot(rs) {
  const td = WR.todayRecs(rs), tl = WR.rank(td);
  $('foot').innerHTML = `<div class="f chk"></div><span>오늘 도전 <b>${td.length}</b>회</span>
    <span class="r">${tl[0] ? `오늘 1위 <b>${WR.fmt(tl[0].sec)}</b> 를 넘어보세요` : '오늘의 첫 기록을 세워보세요'}</span>`;
}

let busy = false;
// 오늘 1위가 바뀌면: 이전 순위를 보여준 뒤 새 1위 카드가 위에서 내리꽂히고, 옛 1위는 밀려 내려감
function slam(rec, prevList, nowList, pA) {
  busy = true; hitKey = WR.personKey(rec);
  $('pop').classList.remove('show');
  page = 'today'; render(false, prevList);
  const old = prevList[0], same = old && WR.personKey(old) === WR.personKey(rec);
  const world = $('world'), hero = $('hero');
  setTimeout(() => {
    const card = document.createElement('section');
    card.className = 'hero slamcard'; card.innerHTML = heroHTML(nowList[0]);
    const sp = document.createElement('div'); sp.className = 'speed on';
    world.appendChild(sp); world.appendChild(card);
    setTimeout(() => {
      card.classList.add('hit');
      if (old) hero.classList.add('knock');
      $('list').classList.toggle('push', !!old && !same);
      world.classList.remove('shake'); void world.offsetWidth; world.classList.add('shake');
      const fl = $('flash'); fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on');
      const du = document.createElement('div'); du.className = 'dust on'; world.appendChild(du);
      const st = $('stamp');
      const sub = old
        ? (same ? `${WR.fmt(old.sec)} → ${WR.fmt(rec.sec)} · ${old.sec - rec.sec}초 단축` : `${esc(old.nick)} ${WR.fmt(old.sec)} → ${esc(rec.nick)} ${WR.fmt(rec.sec)}`)
        : `${rec.lane}번 휠체어 · ${esc(rec.nick)} · 오늘의 첫 1위`;
      st.className = 'on';
      st.innerHTML = `<div class="s1">${same ? '1위 기록 경신!' : '새로운 1위 갱신!'}</div><div class="s2">${sub}${pA === 1 && old ? ' · 누적 1위!' : ''}</div>`;
      setTimeout(() => {
        st.classList.add('out');
        card.remove(); sp.remove(); du.remove();
        render(true); $('hero').classList.remove('go');
        setTimeout(() => { st.className = ''; st.innerHTML = ''; }, 400);
        renderLanes(WR.load(), rec.lane);
        t0 = performance.now(); busy = false;
      }, 3400);
    }, 420);
  }, 700);
}
function showPop(rec) {
  const rs = WR.load(), tl = WR.rank(WR.todayRecs(rs)), al = WR.rank(rs);
  {
    const b0 = tl.find(x => WR.personKey(x) === WR.personKey(rec));
    if (b0 && b0.id === rec.id && WR.placeOf(tl, rec) === 1)
      return slam(rec, WR.rank(WR.todayRecs(rs.filter(r => r.id !== rec.id))), tl, WR.placeOf(al, rec));
  }
  const best = tl.find(x => WR.personKey(x) === WR.personKey(rec));
  const isBest = best && best.id === rec.id, pT = WR.placeOf(tl, rec), pA = WR.placeOf(al, rec);
  const gold = isBest && pT === 1;
  const p = $('pop');
  p.className = 'pop' + (gold ? ' gold' : '');
  p.innerHTML = `<div class="ln">${rec.lane}번 휠체어 · 완주 기록</div>
    <div class="k1">${gold ? 'NEW RECORD' : 'FINISH'}</div>
    <div class="rec">${WR.fmt(rec.sec)}</div>
    <div class="nm">${esc(rec.nick)}</div><div class="sc">${esc(rec.org)}</div>
    <div class="pl">${gold ? '오늘의 1위!' : isBest ? `오늘 ${pT}위` : `내 최고 기록 ${WR.fmt(best.sec)} · 오늘 ${pT}위`}</div>
    ${isBest && pA === 1 ? `<div class="pl2">누적 1위까지 차지했어요</div>` : isBest && pT > 1 ? `<div class="pl2">오늘 1위까지 ${rec.sec - tl[0].sec}초</div>` : ''}`;
  void p.offsetWidth; p.classList.add('show');
  popUntil = performance.now() + 7000;
  hitKey = WR.personKey(rec);
  renderLanes(rs, rec.lane);
}
function onRecords() {
  const rs = WR.load();
  const fresh = rs.filter(r => !seen.has(r.id)).sort((a, b) => a.ts - b.ts);
  rs.forEach(r => seen.add(r.id));
  // 한 건씩 들어온 오늘 기록만 팝업 (예시 넣기·백업 불러오기처럼 여러 건이 한꺼번에 들어오면 팝업 없이 갱신)
  if (fresh.length === 1 && WR.dayKey(fresh[0].ts) === WR.today()) popQ.push(fresh[0]);
  else if (fresh.length) { render(true); return; }
  if (!fresh.length) render(false);
}
WR.on(m => { if (m.type === 'records') onRecords(); if (m.type === 'settings') { t0 = performance.now(); applyPage(true); } if (m.type === 'test') popQ.push(m.rec); });

function applyPage(animate) {
  const s = WR.settings();
  if (s.page !== 'auto') page = s.page;
  render(animate);
}
function tick(now) {
  const s = WR.settings(), hold = Math.max(5, +s.rotate || 15) * 1000;
  const p = $('pop');
  if (busy) { /* 1위 갱신 연출 중 */ }
  else if (p.classList.contains('show') && now > popUntil) {
    p.classList.remove('show'); page = s.page === 'total' ? 'total' : 'today'; t0 = now; render(true);
  } else if (!p.classList.contains('show') && popQ.length) {
    showPop(popQ.shift());
  } else if (!p.classList.contains('show')) {
    if (s.page === 'auto') {
      const k = (now - t0) / hold;
      if (k >= 1) { page = page === 'today' ? 'total' : 'today'; t0 = now; if (page === 'total') hitKey = null; render(true); }
      $('prog').style.width = Math.min(k, 1) * 984 + 'px';
    } else $('prog').style.width = '0';
  }
  const d = new Date();
  $('clock').textContent = WR.pad(d.getHours()) + ':' + WR.pad(d.getMinutes());
  $('date').textContent = WR.dayLabel(Date.now());
  requestAnimationFrame(tick);
}
// 레인 칸만 주기적으로 갱신(날짜가 바뀌면 오늘 기록이 비워짐)
setInterval(() => { if (!$('pop').classList.contains('show')) { renderLanes(WR.load()); renderFoot(WR.load()); } }, 30000);

addEventListener('resize', fit);
document.addEventListener('dblclick', () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} });
let idleT; addEventListener('mousemove', () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 2500); });
fit(); applyPage(true); requestAnimationFrame(tick);
</script>
</body></html>
